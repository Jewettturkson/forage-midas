server:
  # Midas Core's REST API (BalanceQuerier and TaskFiveTests expect this port)
  port: 33400

general:
  kafka-topic: trader-updates

spring:
  kafka:
    # Task tests' @EmbeddedKafka broker listens on localhost:9092
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: midas-core
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        # Allow JSON deserialization into our domain class
        spring.json.trusted.packages: com.jpmc.midascore.foundation
        spring.json.value.default.type: com.jpmc.midascore.foundation.Transaction
        spring.json.use.type.headers: false
